<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Relatórios - FixHub</title>

<link rel="stylesheet" href="relatorios.css">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

<header>

<h1>Relatórios</h1>

<a href="index.html">
<i class="fa-solid fa-house"></i> Início
</a>

</header>

<div class="container">

<div class="cards">

<div class="card total">
<h2 id="total">0</h2>
<p>Total de Chamados</p>
</div>

<div class="card aberto">
<h2 id="abertos">0</h2>
<p>Em Aberto</p>
</div>

<div class="card andamento">
<h2 id="andamento">0</h2>
<p>Em Andamento</p>
</div>

<div class="card finalizado">
<h2 id="finalizados">0</h2>
<p>Finalizados</p>
</div>

</div>

<div class="grafico">

<canvas id="graficoChamados"></canvas>

</div>

</div>

<script src="relatorios.js"></script>

</body>

</html>
